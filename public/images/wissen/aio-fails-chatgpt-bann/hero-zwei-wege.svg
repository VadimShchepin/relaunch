<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Diagramm: von einer Website führen zwei Wege weg. Der obere Weg läuft über mehrere Prüfpunkte zu einer Zitierung, der untere Weg endet an einer Sperre.">
  <defs>
    <linearGradient id="af-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5F2"/>
      <stop offset="1" stop-color="#F2EEE8"/>
    </linearGradient>
    <radialGradient id="af-halo-green" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4FAF8C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4FAF8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="af-halo-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B8431F" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B8431F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="af-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4A5568" opacity=".10"/>
    </pattern>
    <filter id="af-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C1917" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#af-bg)"/>
  <rect width="1200" height="630" fill="url(#af-dots)"/>
  <circle cx="1010" cy="185" r="230" fill="url(#af-halo-green)"/>
  <circle cx="880" cy="470" r="200" fill="url(#af-halo-warm)"/>

  <!-- the site the article is about -->
  <g filter="url(#af-shadow)">
    <rect x="86" y="238" width="212" height="154" rx="20" fill="#FBF9F7" stroke="#E2DCD5" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#C9C2BA" stroke-width="8" stroke-linecap="round">
    <path d="M120 280 H240"/>
    <path d="M120 312 H206"/>
    <path d="M120 344 H228"/>
  </g>
  <circle cx="272" cy="266" r="9" fill="#4FAF8C"/>

  <!-- split point -->
  <circle cx="322" cy="315" r="13" fill="#1C1917" opacity=".18"/>

  <!-- upper path: slow, checked, ends in a citation -->
  <path d="M338 308 C470 292 520 258 604 236 C700 212 800 196 926 186"
        fill="none" stroke="#2D8A65" stroke-width="6" stroke-linecap="round"/>
  <g fill="#FBF9F7" stroke="#2D8A65" stroke-width="5">
    <circle cx="470" cy="278" r="16"/>
    <circle cx="640" cy="226" r="16"/>
    <circle cx="806" cy="198" r="16"/>
  </g>
  <g filter="url(#af-shadow)">
    <circle cx="1000" cy="182" r="62" fill="#2D8A65"/>
  </g>
  <path d="M966 182 L992 210 L1040 156" fill="none" stroke="#FBF9F7" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1000" cy="182" r="88" fill="none" stroke="#2D8A65" stroke-opacity=".22" stroke-width="3"/>
  <circle cx="1000" cy="182" r="114" fill="none" stroke="#2D8A65" stroke-opacity=".10" stroke-width="3"/>

  <!-- lower path: fast, unchecked, stopped by a barrier -->
  <path d="M338 330 C450 372 520 420 606 452 C664 474 716 486 762 492"
        fill="none" stroke="#B8431F" stroke-width="6" stroke-linecap="round" stroke-dasharray="26 20"/>
  <g fill="#B8431F" opacity=".55">
    <circle cx="470" cy="386" r="10"/>
    <circle cx="606" cy="452" r="10"/>
  </g>

  <!-- the barrier -->
  <rect x="806" y="392" width="18" height="200" rx="9" fill="#B8431F"/>
  <g fill="#B8431F" opacity=".38">
    <rect x="838" y="392" width="12" height="200" rx="6"/>
    <rect x="866" y="392" width="8" height="200" rx="4"/>
  </g>
  <path d="M932 442 L1028 538 M1028 442 L932 538" fill="none" stroke="#B8431F" stroke-width="14"
        stroke-linecap="round" opacity=".85"/>

  <!-- ground rules, purely to seat the two paths -->
  <g fill="none" stroke="#1C1917" stroke-opacity=".07" stroke-width="2">
    <path d="M92 596 C420 578 780 574 1108 588"/>
    <path d="M92 96 C420 78 780 74 1108 88"/>
  </g>
</svg>
