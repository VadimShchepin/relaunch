<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Google AI Overview Antwortbox mit zitierten Quellen für Hamburger Unternehmen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F1ECE6"/>
    </linearGradient>
    <linearGradient id="aio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F4FBF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FAF8C"/>
      <stop offset="1" stop-color="#3E8F72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FAF8C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4FAF8C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1C1917" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="930" cy="150" r="320" fill="url(#glow)"/>
  <circle cx="220" cy="560" r="240" fill="url(#glow)"/>

  <!-- search bar -->
  <g filter="url(#shadow)">
    <rect x="120" y="78" width="700" height="56" rx="28" fill="#ffffff"/>
  </g>
  <circle cx="158" cy="106" r="11" fill="none" stroke="#7D8C9E" stroke-width="3"/>
  <line x1="167" y1="115" x2="178" y2="126" stroke="#7D8C9E" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="114" font-family="Inter, Arial, sans-serif" font-size="20" fill="#111111">ki sichtbarkeit agentur hamburg</text>
  <rect x="690" y="92" width="112" height="28" rx="14" fill="#EAF6F1"/>
  <text x="746" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#3E8F72" text-anchor="middle">Google</text>

  <!-- AI Overview card -->
  <g filter="url(#shadow)">
    <rect x="120" y="170" width="700" height="372" rx="22" fill="url(#aio)" stroke="#4FAF8C" stroke-width="2"/>
  </g>

  <!-- sparkle + label -->
  <g transform="translate(150 205)">
    <path d="M14 0 L18 10 L28 14 L18 18 L14 28 L10 18 L0 14 L10 10 Z" fill="url(#accent)"/>
  </g>
  <text x="190" y="217" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1917">AI Overview</text>
  <rect x="334" y="200" width="92" height="24" rx="12" fill="#FFEDE8"/>
  <text x="380" y="217" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FF5E3A" text-anchor="middle">generativ</text>

  <!-- answer lines -->
  <rect x="150" y="248" width="640" height="13" rx="6.5" fill="#1C1917" opacity="0.82"/>
  <rect x="150" y="274" width="600" height="13" rx="6.5" fill="#3A3A3A" opacity="0.55"/>
  <rect x="150" y="300" width="640" height="13" rx="6.5" fill="#3A3A3A" opacity="0.55"/>
  <rect x="150" y="326" width="430" height="13" rx="6.5" fill="#3A3A3A" opacity="0.55"/>

  <!-- cited sources label -->
  <text x="150" y="382" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#7D8C9E">Quellen in dieser Antwort</text>

  <!-- citation chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="150" y="398" width="200" height="40" rx="20" fill="#EAF6F1" stroke="#4FAF8C" stroke-width="1.5"/>
      <circle cx="176" cy="418" r="9" fill="#4FAF8C"/>
      <text x="178" y="423" fill="#ffffff" font-size="11" text-anchor="middle">1</text>
      <text x="196" y="423" fill="#1C1917">aiseo.hamburg</text>
    </g>
    <g opacity="0.7">
      <rect x="366" y="398" width="150" height="40" rx="20" fill="#ffffff" stroke="#D8D2CB" stroke-width="1.5"/>
      <circle cx="392" cy="418" r="9" fill="#9CA38A"/>
      <text x="394" y="423" fill="#ffffff" font-size="11" text-anchor="middle">2</text>
      <text x="410" y="423" fill="#3A3A3A">Fachquelle</text>
    </g>
    <g opacity="0.7">
      <rect x="532" y="398" width="150" height="40" rx="20" fill="#ffffff" stroke="#D8D2CB" stroke-width="1.5"/>
      <circle cx="558" cy="418" r="9" fill="#9CA38A"/>
      <text x="560" y="423" fill="#ffffff" font-size="11" text-anchor="middle">3</text>
      <text x="576" y="423" fill="#3A3A3A">Studie</text>
    </g>
  </g>

  <!-- divider + traditional results faded -->
  <line x1="150" y1="470" x2="790" y2="470" stroke="#E4DED7" stroke-width="2"/>
  <rect x="150" y="488" width="280" height="11" rx="5.5" fill="#7D8C9E" opacity="0.35"/>
  <rect x="150" y="510" width="500" height="9" rx="4.5" fill="#9CA38A" opacity="0.30"/>

  <!-- right rail: outcome -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="868" y="206" font-size="15" font-weight="700" fill="#3E8F72" letter-spacing="1">HAMBURG</text>
    <text x="868" y="252" font-size="34" font-weight="800" fill="#111111">Empfohlen,</text>
    <text x="868" y="294" font-size="34" font-weight="800" fill="#111111">nicht nur</text>
    <text x="868" y="336" font-size="34" font-weight="800" fill="#4FAF8C">gerankt.</text>

    <g transform="translate(868 392)">
      <rect x="0" y="0" width="200" height="74" rx="14" fill="#ffffff" filter="url(#shadow)"/>
      <text x="20" y="34" font-size="28" font-weight="800" fill="#1C1917">Platz 1</text>
      <text x="20" y="58" font-size="13" fill="#7D8C9E">der zitierten Quellen</text>
    </g>
    <g transform="translate(868 480)">
      <rect x="0" y="0" width="200" height="74" rx="14" fill="#1C1917" filter="url(#shadow)"/>
      <text x="20" y="34" font-size="28" font-weight="800" fill="#4FAF8C">E-E-A-T</text>
      <text x="20" y="58" font-size="13" fill="#C9C4BD">als Einschlusssignal</text>
    </g>
  </g>

  <text x="120" y="610" font-family="Inter, Arial, sans-serif" font-size="15" fill="#7D8C9E">Google AI Overviews &amp; AI Mode Optimierung &middot; aiseo.hamburg</text>
</svg>
