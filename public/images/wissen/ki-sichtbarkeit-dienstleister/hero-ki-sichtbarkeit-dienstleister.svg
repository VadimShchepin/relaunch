<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Abstrakte Netzwerkillustration vom unsichtbaren Experten zum empfohlenen Anbieter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5F2"/>
      <stop offset="1" stop-color="#F1EDE7"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4FAF8C" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#4FAF8C" stop-opacity=".14"/>
      <stop offset="1" stop-color="#4FAF8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7D8C9E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7D8C9E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C1917" flood-opacity=".12"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.31 0 1 0 0 0.69 0 0 1 0 0.55 0 0 0 .8 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7D8C9E" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="890" cy="205" r="270" fill="url(#gGlow)"/>
  <circle cx="280" cy="480" r="220" fill="url(#soft)"/>

