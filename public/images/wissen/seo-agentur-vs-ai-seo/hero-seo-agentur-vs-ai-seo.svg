<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vergleich von klassischen Rankings und KI-Empfehlungen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5F2"/>
      <stop offset="1" stop-color="#F2EEE8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FAF8C"/>
      <stop offset="1" stop-color="#3D8F73"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4FAF8C" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4FAF8C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C1917" flood-opacity=".12"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.31 0 1 0 0 0.69 0 0 1 0 0.55 0 0 0 .8 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7D8C9E" opacity=".11"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="200" cy="160" r="200" fill="url(#halo)" opacity=".55"/>
  <circle cx="960" cy="460" r="250" fill="url(#halo)" opacity=".7"/>

  <line x1="600" y1="72" x2="600" y2="558" stroke="#1C1917" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="5 8"/>
  <rect x="598.5" y="70" width="3" height="490" fill="#FF5E3A" opacity=".55"/>

